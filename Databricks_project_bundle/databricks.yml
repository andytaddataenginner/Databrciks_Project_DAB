# This is a Declarative Automation Bundle definition for Databricks_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Databricks_project_bundle
  uuid: daf9750d-e863-4cf8-b523-c1c324d769d2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-646d7ee2-50ee.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-646d7ee2-50ee.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ndy.andupa@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ndy.andupa@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_dev
      schema: prod
    permissions:
      - user_name: ndy.andupa@gmail.com
        level: CAN_MANAGE
